name: Weekly market review (verified data)
on:
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-market-review
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate weekly HTML report from validated market closing prices
        run: python scripts/publish_weekly.py
      - name: Commit report only when validation succeeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly/
          if ! git diff --cached --quiet; then
            git commit -m "Publish weekly market report"
            git push
          fi

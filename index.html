</style></head><body><div class="wrap"><div class="bar"></div><h1>סקירת שווקים שבועית</h1><div class="sub">ארכיון הסקירות השבועיות המלאות</div>
<div class="box" id="weeks"><a href="./weekly/2026-10-25/">סקירה שבועית · 25.10.2026</a><a href="./weekly/2026-10-18/">סקירה שבועית · 18.10.2026</a><a href="./weekly/2026-10-11/">סקירה שבועית · 11.10.2026</a></div><script>fetch('https://api.github.com/repos/Doronsh170/weekly-market-review/contents/weekly').then(r=>r.json()).then(a=>{if(!Array.isArray(a))return;let dates=a.filter(x=>x.type==='dir'&&/^\d{4}-\d{2}-\d{2}$/.test(x.name)).map(x=>x.name).filter(x=>x!=='2026-10-04').sort().reverse();if(!dates.length)return;document.getElementById('weeks').innerHTML=dates.map(x=>'<a href="./weekly/'+x+'/">סקירה שבועית · '+x.split('-').reverse().join('.')+'</a>').join('')}).catch(()=>{});</script>
